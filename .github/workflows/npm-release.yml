# Publish only. PR/main CI owns tests; this workflow ends when npm publish succeeds.
name: Release scoped native addon to npm
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'papercraftgames/Estragon'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.2
      - name: Package the published tag
        run: >-
          node --experimental-strip-types tools/pack-addon.ts
          "$RUNNER_TEMP/estragon-release" --require-clean --release-context
      - name: Publish to npm
        run: |
          TARBALL="$(node -p "require(process.argv[1]).tarball" "$RUNNER_TEMP/estragon-release/package-manifest.json")"
          npm publish "$RUNNER_TEMP/estragon-release/$TARBALL" --access public --tag beta --provenance --ignore-scripts
