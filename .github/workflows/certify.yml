name: Exact-source release certification
on:
  workflow_call:
    inputs:
      source:
        required: true
        type: string
permissions:
  contents: read
jobs:
  policy:
    name: release-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run check
  addon:
    needs: policy
    name: release-certification (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        version: ['4.0.4', '4.7']
    env:
      ESTRAGON_RELEASE_CERTIFICATION: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      GODOT_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
      - name: Bind certification to exact requested source
        env:
          EXPECTED_SOURCE: ${{ inputs.source }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Isolated software-GL display (Xvfb, no Vulkan setup)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/xdg-runtime"
          chmod 700 "$RUNNER_TEMP/xdg-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg-runtime" >> "$GITHUB_ENV"
      - name: Select immutable engine cache identity
        id: engine
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const engine=JSON.parse(fs.readFileSync('tests/compatibility/linux-engines.json')).find(e=>e.version.startsWith(process.env.GODOT_VERSION+'.stable.'));
          if(!engine)throw Error('Unapproved engine');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'sha256='+engine.binary_sha256+'\n');
          JS
      - uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/estragon-godot/${{ matrix.version }}
          key: godot-${{ runner.os }}-${{ runner.arch }}-${{ matrix.version }}-${{ steps.engine.outputs.sha256 }}
      - name: Authenticate official Linux engine
        env:
          GODOT_CACHE_DIRECTORY: ${{ runner.tool_cache }}/estragon-godot/${{ matrix.version }}
        run: node --experimental-strip-types tools/download-compat-engine.ts
      - name: Pin local publishing-tool pack implementation
        run: npm install --global npm@11.13.0
      - name: Bounded direct-install release acceptance
        working-directory: ${{ runner.temp }}
        run: >-
          xvfb-run -a corepack yarn@1.22.22 node --experimental-strip-types
          "$GITHUB_WORKSPACE/tools/check-native-addon.ts"
          --engine '${{ matrix.version }}=${{ env.GODOT_BIN }}'
          --output "$RUNNER_TEMP/native-addon" --fast-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-addon-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/native-addon
            ${{ runner.temp }}/official-4.0.4-SHA512-SUMS.txt
