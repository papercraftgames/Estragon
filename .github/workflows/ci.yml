name: Compiler and Godot checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verification_mode:
        description: "Development integrity or strict release authorization (no publishing)"
        type: choice
        options: [development, release, c3-focused]
        default: development

concurrency:
  group: core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gogo-compiler:
    if: inputs.verification_mode != 'c3-focused'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck Gogo tooling
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Check native frontend reference transcript
        run: |
          bun tools/native-frontend-cases.ts
          bun tools/native-generation-cases.ts
      - name: Check committed example IR matches source
        run: bun run verify:ir
      - name: Check committed GDScript matches Gogo source
        run: bun run verify:gdscript

  godot-validation:
    if: inputs.verification_mode != 'c3-focused'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install official Godot 4.7 stable editor
        env:
          GODOT_URL: https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
        run: |
          curl --fail --location --retry 3 "$GODOT_URL" --output "$RUNNER_TEMP/godot.zip"
          echo "0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  $RUNNER_TEMP/godot.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/godot-bin"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          chmod +x "$RUNNER_TEMP/godot-bin/Godot_v4.7-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot-bin/Godot_v4.7-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Install and verify B1 software graphics drivers
        id: b1-graphics
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mesa-vulkan-drivers vulkan-tools
          vulkan_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test "${#vulkan_icds[@]}" -eq 1
          vulkan_icd="${vulkan_icds[0]}"
          test -f "$vulkan_icd"
          echo "vulkan_icd=$vulkan_icd" >> "$GITHUB_OUTPUT"
          mkdir -m 700 "$RUNNER_TEMP/b1-xdg-runtime"
          # The editor uses OpenGL but can also probe Vulkan. Xvfb provides
          # X11, not a Vulkan ICD; select lavapipe instead of a hardware ICD.
          VK_DRIVER_FILES="$vulkan_icd" VK_ICD_FILENAMES="$vulkan_icd" \
            XDG_RUNTIME_DIR="$RUNNER_TEMP/b1-xdg-runtime" \
            xvfb-run -a vulkaninfo --summary
      - name: B1 native GGX composition, signals and editor persistence
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          VK_DRIVER_FILES: ${{ steps.b1-graphics.outputs.vulkan_icd }}
          VK_ICD_FILENAMES: ${{ steps.b1-graphics.outputs.vulkan_icd }}
          XDG_RUNTIME_DIR: ${{ runner.temp }}/b1-xdg-runtime
        working-directory: ${{ runner.temp }}
        run: |
          xvfb-run -a corepack yarn@1.22.22 node --experimental-strip-types "$GITHUB_WORKSPACE/tools/check-node-proof.ts" --engine "$GODOT_BIN" --output "$RUNNER_TEMP/ggx-b1"
          xvfb-run -a corepack yarn@1.22.22 node --experimental-strip-types "$GITHUB_WORKSPACE/tools/check-node-proof.ts" --engine "$GODOT_BIN" --output "$RUNNER_TEMP/ggx-b1" --phase visual
      - name: B2 shared 2D/3D layout, native runtime and graphics proof
        working-directory: ${{ runner.temp }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          VK_DRIVER_FILES: ${{ steps.b1-graphics.outputs.vulkan_icd }}
          VK_ICD_FILENAMES: ${{ steps.b1-graphics.outputs.vulkan_icd }}
          XDG_RUNTIME_DIR: ${{ runner.temp }}/b1-xdg-runtime
        run: >-
          xvfb-run -a corepack yarn@1.22.22 node --experimental-strip-types
          "$GITHUB_WORKSPACE/tools/check-layout-proof.ts"
          --engine '4.7=${{ env.GODOT_BIN }}'
          --output "$RUNNER_TEMP/ggx-b2" --graphics
      - name: B3 native adapters, editor persistence and graphics proof
        working-directory: ${{ runner.temp }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          VK_DRIVER_FILES: ${{ steps.b1-graphics.outputs.vulkan_icd }}
          VK_ICD_FILENAMES: ${{ steps.b1-graphics.outputs.vulkan_icd }}
          XDG_RUNTIME_DIR: ${{ runner.temp }}/b1-xdg-runtime
        run: >-
          xvfb-run -a corepack yarn@1.22.22 node --experimental-strip-types
          "$GITHUB_WORKSPACE/tools/check-adapter-proof.ts"
          --engine '4.7=${{ env.GODOT_BIN }}'
          --output "$RUNNER_TEMP/ggx-b3" --graphics
      - name: C1 Node-native runtime, editor persistence and graphics
        working-directory: ${{ runner.temp }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          VK_DRIVER_FILES: ${{ steps.b1-graphics.outputs.vulkan_icd }}
          VK_ICD_FILENAMES: ${{ steps.b1-graphics.outputs.vulkan_icd }}
          XDG_RUNTIME_DIR: ${{ runner.temp }}/b1-xdg-runtime
        run: >-
          xvfb-run -a corepack yarn@1.22.22 node --experimental-strip-types
          "$GITHUB_WORKSPACE/tools/check-node-runtime.ts"
          --engine '4.7=${{ env.GODOT_BIN }}'
          --output "$RUNNER_TEMP/node-runtime-c1" --graphics
      - name: C2 Gogo native GGX, real editor Play and graphics
        working-directory: ${{ runner.temp }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          VK_DRIVER_FILES: ${{ steps.b1-graphics.outputs.vulkan_icd }}
          VK_ICD_FILENAMES: ${{ steps.b1-graphics.outputs.vulkan_icd }}
          XDG_RUNTIME_DIR: ${{ runner.temp }}/b1-xdg-runtime
        run: >-
          xvfb-run -a corepack yarn@1.22.22 node --experimental-strip-types
          "$GITHUB_WORKSPACE/tools/check-ggx.ts"
          --engine '4.7=${{ env.GODOT_BIN }}'
          --output "$RUNNER_TEMP/native-ggx-c2" --graphics
      - name: C3 native widgets and Counter, input/editor/graphics
        working-directory: ${{ runner.temp }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          VK_DRIVER_FILES: ${{ steps.b1-graphics.outputs.vulkan_icd }}
          VK_ICD_FILENAMES: ${{ steps.b1-graphics.outputs.vulkan_icd }}
          XDG_RUNTIME_DIR: ${{ runner.temp }}/b1-xdg-runtime
        run: >-
          xvfb-run -a corepack yarn@1.22.22 node --experimental-strip-types
          "$GITHUB_WORKSPACE/tools/check-native-ui.ts"
          --engine '4.7=${{ env.GODOT_BIN }}'
          --output "$RUNNER_TEMP/native-ui-c3" --graphics
      - name: Godot source UID and clean-editor metadata audit
        working-directory: ${{ runner.temp }}
        run: >-
          corepack yarn@1.22.22 node --experimental-strip-types
          "$GITHUB_WORKSPACE/tools/check-godot-metadata.ts"
          --engine '4.7=${{ env.GODOT_BIN }}'
          --output "$RUNNER_TEMP/godot-metadata"
      - name: R01 stock Godot annotation and real-editor feasibility probes
        run: sh tools/check-bindable.sh
      - name: E01 isolated highlighting and full-addon startup diagnostic (4.7 only)
        run: sh tools/check-highlighting-compat.sh
      - name: Native frontend with Bun unavailable
        run: sh tools/check-native-frontend.sh
      - name: Native compilation and Counter runtime with Bun and Node unavailable
        run: sh tools/check-native-generation.sh
      - name: Import, parse every GDScript, and run runtime smoke
        run: bun run check:godot
      - name: Prove import, parse, and runtime failures are rejected
        run: bun run test:godot-harness
      - name: Verify fresh native editor Play, transactions and restart without Bun or Node
        run: sh tools/check-editor.sh
      - name: C01-H baseline compiler and publication evidence
        run: >-
          node --experimental-strip-types tools/check-compatibility.ts
          --engine '4.7=${{ env.GODOT_BIN }}'
          --output '${{ runner.temp }}/compatibility' --collect-only
      - name: C01-H baseline lifecycle and unsaved Play evidence
        run: |
          node --experimental-strip-types tools/check-editor-lifecycle.ts --engine '4.7=${{ env.GODOT_BIN }}' --output '${{ runner.temp }}/editor-lifecycle'
          node --experimental-strip-types tools/check-editor-play.ts --engine '4.7=${{ env.GODOT_BIN }}' --output '${{ runner.temp }}/editor-play'
      - name: C01-H native X11/Mesa graphics and fresh distribution
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          xvfb-run -a node --experimental-strip-types tools/check-distribution.ts
          --engine '4.7=${{ env.GODOT_BIN }}'
          --output '${{ runner.temp }}/distribution' --graphics --collect-only
      - name: C01-H development integrity or explicit strict release gate
        run: >-
          node --experimental-strip-types tools/assert-release.ts
          --mode "${{ inputs.verification_mode || 'development' }}"
          '${{ runner.temp }}/compatibility/results.json'
          '${{ runner.temp }}/distribution/results.json'
          '${{ runner.temp }}/editor-lifecycle/results.json'
          '${{ runner.temp }}/editor-play/results.json'
          '${{ runner.temp }}/release-assessment.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-4.7-ggx-b2
          path: ${{ runner.temp }}/ggx-b2
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-4.7-ggx-b3-metadata
          path: |
            ${{ runner.temp }}/ggx-b3
            ${{ runner.temp }}/godot-metadata
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-4.7-node-runtime-c1
          path: ${{ runner.temp }}/node-runtime-c1
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-4.7-native-ggx-c2
          path: ${{ runner.temp }}/native-ggx-c2
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-4.7-native-ui-c3
          path: ${{ runner.temp }}/native-ui-c3
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-4.7-ggx-b1
          path: |
            ${{ runner.temp }}/ggx-b1/*.log
            ${{ runner.temp }}/ggx-b1/provenance.json
            ${{ runner.temp }}/ggx-b1/project/b1-*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-4.7.0-release-evidence
          path: |
            ${{ runner.temp }}/compatibility
            ${{ runner.temp }}/distribution
            ${{ runner.temp }}/editor-lifecycle
            ${{ runner.temp }}/editor-play
            ${{ runner.temp }}/release-assessment.json
          if-no-files-found: warn

  c3-focused:
    if: github.event_name == 'workflow_dispatch' && inputs.verification_mode == 'c3-focused'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Install official Godot 4.7 stable editor
        env:
          GODOT_URL: https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
        run: |
          curl --fail --location --retry 3 "$GODOT_URL" --output "$RUNNER_TEMP/godot.zip"
          echo "0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  $RUNNER_TEMP/godot.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/godot-bin"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          chmod +x "$RUNNER_TEMP/godot-bin/Godot_v4.7-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot-bin/Godot_v4.7-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Install and verify B1 software graphics drivers
        id: b1-graphics
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mesa-vulkan-drivers vulkan-tools
          vulkan_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test "${#vulkan_icds[@]}" -eq 1
          vulkan_icd="${vulkan_icds[0]}"
          test -f "$vulkan_icd"
          echo "vulkan_icd=$vulkan_icd" >> "$GITHUB_OUTPUT"
          mkdir -m 700 "$RUNNER_TEMP/b1-xdg-runtime"
          # The editor uses OpenGL but can also probe Vulkan. Xvfb provides
          # X11, not a Vulkan ICD; select lavapipe instead of a hardware ICD.
          VK_DRIVER_FILES="$vulkan_icd" VK_ICD_FILENAMES="$vulkan_icd" \
            XDG_RUNTIME_DIR="$RUNNER_TEMP/b1-xdg-runtime" \
            xvfb-run -a vulkaninfo --summary
      - name: Focused native C3 development check (4.7 only)
        working-directory: ${{ runner.temp }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          VK_DRIVER_FILES: ${{ steps.b1-graphics.outputs.vulkan_icd }}
          VK_ICD_FILENAMES: ${{ steps.b1-graphics.outputs.vulkan_icd }}
          XDG_RUNTIME_DIR: ${{ runner.temp }}/b1-xdg-runtime
        run: >-
          xvfb-run -a corepack yarn@1.22.22 node --experimental-strip-types
          "$GITHUB_WORKSPACE/tools/check-native-ui.ts"
          --engine '4.7=${{ env.GODOT_BIN }}' --output "$RUNNER_TEMP/native-ui-c3" --runtime-only --graphics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-focused-evidence
          path: ${{ runner.temp }}/native-ui-c3
          if-no-files-found: warn
