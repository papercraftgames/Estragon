name: Native addon acceptance
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      verification_mode:
        description: Full two-engine addon acceptance or focused 4.7 development
        type: choice
        options: [acceptance, focused, distribution, bindable, reactive, composition, conditional, lists, cutover, twoway, profiling, package]
        default: acceptance
      engine:
        description: Approved engine for focused development only
        type: choice
        options: ['4.7', '4.0.4']
        default: '4.7'
concurrency:
  group: native-addon-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run check
  addon:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.verification_mode != 'acceptance' && github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.engine || '4.7') || '["4.0.4", "4.7"]') }}
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GODOT_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify software graphics
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mesa-vulkan-drivers vulkan-tools
          vulkan_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test "${#vulkan_icds[@]}" -eq 1
          vulkan_icd="${vulkan_icds[0]}"
          test -f "$vulkan_icd"
          mkdir -m 700 "$RUNNER_TEMP/xdg-runtime"
          VK_DRIVER_FILES="$vulkan_icd" VK_ICD_FILENAMES="$vulkan_icd" \
            XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime" xvfb-run -a vulkaninfo --summary
          echo "VK_DRIVER_FILES=$vulkan_icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$vulkan_icd" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg-runtime" >> "$GITHUB_ENV"
      - name: Authenticate official Linux engine
        run: node --experimental-strip-types tools/download-compat-engine.ts
      - name: Pin local publishing-tool pack implementation
        run: npm install --global npm@11.13.0
      - name: Current native addon acceptance
        working-directory: ${{ runner.temp }}
        run: >-
          xvfb-run -a corepack yarn@1.22.22 node --experimental-strip-types
          "$GITHUB_WORKSPACE/tools/check-native-addon.ts"
          --engine '${{ matrix.version }}=${{ env.GODOT_BIN }}'
          --output "$RUNNER_TEMP/native-addon"
          ${{ inputs.verification_mode == 'focused' && '--focused' || inputs.verification_mode == 'distribution' && '--distribution-only' || inputs.verification_mode == 'bindable' && '--bindable-only' || inputs.verification_mode == 'reactive' && '--reactive-only' || inputs.verification_mode == 'composition' && '--composition-only' || inputs.verification_mode == 'cutover' && '--cutover-only' || inputs.verification_mode == 'lists' && '--lists-only' || inputs.verification_mode == 'package' && '--package-only' || inputs.verification_mode == 'profiling' && '--profiling-only' || inputs.verification_mode == 'twoway' && '--twoway-only' || inputs.verification_mode == 'conditional' && '--conditional-only' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-addon-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/native-addon
            ${{ runner.temp }}/official-4.0.4-SHA512-SUMS.txt
