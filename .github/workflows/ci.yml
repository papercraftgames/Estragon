name: Native addon acceptance
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      verification_mode:
        description: Full two-engine addon acceptance or focused 4.7 development
        type: choice
        options: [acceptance, focused, distribution, bindable, reactive, composition, conditional, lists, cutover, twoway, profiling, package]
        default: acceptance
      engine:
        description: Approved engine for focused development only
        type: choice
        options: ['4.7', '4.0.4']
        default: '4.7'
concurrency:
  group: native-addon-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tooling:
    outputs:
      native: ${{ steps.plan.outputs.native }}
      suites: ${{ steps.plan.outputs.suites }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Select proportionate native checks (main is always full)
        id: plan
        run: node --experimental-strip-types tools/ci-plan.ts
  addon:
    needs: tooling
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.verification_mode != 'acceptance' && github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.engine || '4.7') || '["4.0.4", "4.7"]') }}
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GODOT_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: needs.tooling.outputs.native == 'true' && (github.event_name != 'pull_request' || matrix.version == '4.7')
        with:
          node-version: '22.16.0'
      - name: Verify software graphics
        if: needs.tooling.outputs.native == 'true' && (github.event_name != 'pull_request' || matrix.version == '4.7')
        shell: bash
        run: |
          # Avoid an unconditional apt index/download when hosted images already have Mesa.
          if ! command -v vulkaninfo >/dev/null || ! compgen -G '/usr/share/vulkan/icd.d/lvp_icd*.json' >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y mesa-vulkan-drivers vulkan-tools
          fi
          vulkan_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test "${#vulkan_icds[@]}" -eq 1
          vulkan_icd="${vulkan_icds[0]}"
          test -f "$vulkan_icd"
          mkdir -m 700 "$RUNNER_TEMP/xdg-runtime"
          VK_DRIVER_FILES="$vulkan_icd" VK_ICD_FILENAMES="$vulkan_icd" \
            XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime" xvfb-run -a vulkaninfo --summary
          echo "VK_DRIVER_FILES=$vulkan_icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$vulkan_icd" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg-runtime" >> "$GITHUB_ENV"
      - name: Select immutable engine cache identity
        if: needs.tooling.outputs.native == 'true' && (github.event_name != 'pull_request' || matrix.version == '4.7')
        id: engine
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const engine=JSON.parse(fs.readFileSync('tests/compatibility/linux-engines.json')).find(e=>e.version.startsWith(process.env.GODOT_VERSION+'.stable.'));
          if(!engine)throw Error('Unapproved engine');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'sha256='+engine.binary_sha256+'\n');
          JS
      - uses: actions/cache@v4
        if: needs.tooling.outputs.native == 'true' && (github.event_name != 'pull_request' || matrix.version == '4.7')
        with:
          path: ${{ runner.tool_cache }}/estragon-godot/${{ matrix.version }}
          key: godot-${{ runner.os }}-${{ runner.arch }}-${{ matrix.version }}-${{ steps.engine.outputs.sha256 }}
      - name: Authenticate official Linux engine
        if: needs.tooling.outputs.native == 'true' && (github.event_name != 'pull_request' || matrix.version == '4.7')
        env:
          GODOT_CACHE_DIRECTORY: ${{ runner.tool_cache }}/estragon-godot/${{ matrix.version }}
        run: node --experimental-strip-types tools/download-compat-engine.ts
      - name: Pin local publishing-tool pack implementation
        if: needs.tooling.outputs.native == 'true' && (github.event_name != 'pull_request' || matrix.version == '4.7')
        run: npm install --global npm@11.13.0
      - name: Current native addon acceptance
        if: needs.tooling.outputs.native == 'true' && (github.event_name != 'pull_request' || matrix.version == '4.7')
        env:
          PR_SUITES: ${{ github.event_name == 'pull_request' && needs.tooling.outputs.suites || '' }}
        working-directory: ${{ runner.temp }}
        run: >-
          xvfb-run -a corepack yarn@1.22.22 node --experimental-strip-types
          "$GITHUB_WORKSPACE/tools/check-native-addon.ts"
          --engine '${{ matrix.version }}=${{ env.GODOT_BIN }}'
          --output "$RUNNER_TEMP/native-addon"
          ${PR_SUITES:+--suites=$PR_SUITES}
          ${{ inputs.verification_mode == 'focused' && '--focused' || inputs.verification_mode == 'distribution' && '--distribution-only' || inputs.verification_mode == 'bindable' && '--bindable-only' || inputs.verification_mode == 'reactive' && '--reactive-only' || inputs.verification_mode == 'composition' && '--composition-only' || inputs.verification_mode == 'cutover' && '--cutover-only' || inputs.verification_mode == 'lists' && '--lists-only' || inputs.verification_mode == 'package' && '--package-only' || inputs.verification_mode == 'profiling' && '--profiling-only' || inputs.verification_mode == 'twoway' && '--twoway-only' || inputs.verification_mode == 'conditional' && '--conditional-only' || '' }}
      - uses: actions/upload-artifact@v4
        if: always() && needs.tooling.outputs.native == 'true' && (github.event_name != 'pull_request' || matrix.version == '4.7')
        with:
          name: native-addon-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/native-addon
            ${{ runner.temp }}/official-4.0.4-SHA512-SUMS.txt
      - name: Native check policy status
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          NATIVE: ${{ needs.tooling.outputs.native }}
          TOOLING: ${{ needs.tooling.result }}
          ENGINE: ${{ matrix.version }}
        run: |
          if [ "$TOOLING" != success ]; then echo "Selection/tooling failed"; exit 1; fi
          if [ "$NATIVE" != true ]; then echo "Documentation-only: policy/tooling passed; no Godot work scheduled.";
          elif [ "$EVENT_NAME" = pull_request ] && [ "$ENGINE" = 4.0.4 ]; then echo "PR native checks use pinned 4.7; full two-engine acceptance remains mandatory on main.";
          else echo "See native acceptance results and ci-performance.json."; fi
