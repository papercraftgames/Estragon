name: Native addon acceptance
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      verification_mode:
        description: Routine checks or explicit read-only full pre-publication preview
        type: choice
        options: [routine, certification]
        default: routine
permissions:
  contents: read
  actions: read
concurrency:
  group: native-addon-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tooling:
    if: inputs.verification_mode != 'certification'
    outputs:
      native: ${{ steps.plan.outputs.native }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Select tiny smoke (same policy for PR and main)
        id: plan
        run: node --experimental-strip-types tools/ci-plan.ts
  addon:
    if: inputs.verification_mode != 'certification'
    needs: tooling
    runs-on: ubuntu-latest
    timeout-minutes: 1
    strategy:
      fail-fast: false
      matrix:
        version: ['4.0.4', '4.7']
    env:
      GODOT_VERSION: '4.7'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: needs.tooling.outputs.native == 'true' && matrix.version == '4.7'
        with:
          node-version: '22.16.0'
      - name: Select immutable engine cache identity
        if: needs.tooling.outputs.native == 'true' && matrix.version == '4.7'
        id: engine
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const engine=JSON.parse(fs.readFileSync('tests/compatibility/linux-engines.json')).find(e=>e.version.startsWith('4.7.stable.'));
          if(!engine)throw Error('Unapproved engine');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'sha256='+engine.binary_sha256+'\n');
          JS
      - uses: actions/cache@v4
        if: needs.tooling.outputs.native == 'true' && matrix.version == '4.7'
        with:
          path: ${{ runner.tool_cache }}/estragon-godot/4.7
          key: godot-${{ runner.os }}-${{ runner.arch }}-4.7-${{ steps.engine.outputs.sha256 }}
      - name: Authenticate pinned binary even on cache hit
        if: needs.tooling.outputs.native == 'true' && matrix.version == '4.7'
        env:
          GODOT_CACHE_DIRECTORY: ${{ runner.tool_cache }}/estragon-godot/4.7
        run: node --experimental-strip-types tools/download-compat-engine.ts
      - name: Tiny native sanity (no editor or graphics)
        if: needs.tooling.outputs.native == 'true' && matrix.version == '4.7'
        working-directory: ${{ runner.temp }}
        run: >-
          corepack yarn@1.22.22 node --experimental-strip-types
          "$GITHUB_WORKSPACE/tools/check-routine-smoke.ts"
          --engine "4.7=${{ env.GODOT_BIN }}" --output "$RUNNER_TEMP/routine-smoke"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: routine-smoke-failure
          path: ${{ runner.temp }}/routine-smoke
      - name: Native check policy status
        run: echo 'Routine checks only. Two-engine 73-stage certification is mandatory before publication.'
  certify:
    if: github.event_name == 'workflow_dispatch' && inputs.verification_mode == 'certification' && github.repository == 'papercraftgames/Estragon'
    uses: ./.github/workflows/certify.yml
    with:
      source: ${{ github.sha }}
  certification-preview:
    needs: certify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Independent exact-source pre-publication artifact gate (never publishes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types tools/verify-npm-release.ts "$RUNNER_TEMP/approved-package"
      - uses: actions/upload-artifact@v4
        with:
          name: approved-npm-package
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/approved-package/*.tgz
            ${{ runner.temp }}/approved-package/release-ready.json
