# Reference: resistdesign/voltra/.github/workflows/release-npm.yml (release.published/OIDC).
name: Release scoped native addon to npm
on:
  release:
    types: [published]
  workflow_dispatch: {} # Optional read-only main preview; never publishes.
permissions:
  contents: read
  actions: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  certify:
    if: github.repository == 'papercraftgames/Estragon'
    uses: ./.github/workflows/certify.yml
    with:
      source: ${{ github.sha }}
  prepare:
    needs: certify
    if: github.repository == 'papercraftgames/Estragon'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify current-run exact-source certification and identical tested tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types tools/verify-npm-release.ts "$RUNNER_TEMP/approved-package"
      - uses: actions/upload-artifact@v4
        with:
          name: approved-npm-package
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/approved-package/*.tgz
            ${{ runner.temp }}/approved-package/release-ready.json
  publish:
    needs: [certify, prepare]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.2
      - uses: actions/download-artifact@v4
        with:
          name: approved-npm-package
          path: ${{ runner.temp }}/approved-package
      - name: Publish exact certified tarball via OIDC
        run: node --experimental-strip-types tools/publish-prepared.ts "$RUNNER_TEMP/approved-package"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-publication-status
          path: ${{ runner.temp }}/approved-package/publication-status.json
  consumer:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        version: ['4.0.4', '4.7']
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GODOT_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: approved-npm-package
          path: ${{ runner.temp }}/approved-package
      - name: Isolated software-GL display (no Vulkan apt install)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/xdg-runtime"
          chmod 700 "$RUNNER_TEMP/xdg-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg-runtime" >> "$GITHUB_ENV"
      - name: Authenticate official Linux engine
        run: node --experimental-strip-types tools/download-compat-engine.ts
      - name: Fresh registry Yarn to Godot native consumer
        working-directory: ${{ runner.temp }}
        env:
          ESTRAGON_PUBLISHED_PACKAGE_DIRECTORY: ${{ runner.temp }}/approved-package
        run: >-
          xvfb-run -a corepack yarn@1.22.22 node --experimental-strip-types
          "$GITHUB_WORKSPACE/tools/check-native-addon.ts"
          --engine '${{ matrix.version }}=${{ env.GODOT_BIN }}'
          --output "$RUNNER_TEMP/published-consumer" --package-only --direct-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-consumer-${{ matrix.version }}
          path: ${{ runner.temp }}/published-consumer
  result:
    if: always()
    needs: [certify, prepare, publish, consumer]
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      CERTIFY_RESULT: ${{ needs.certify.result }}
      PREPARE_RESULT: ${{ needs.prepare.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      CONSUMER_RESULT: ${{ needs.consumer.result }}
    steps:
      - name: Record release result (publication alone is not acceptance)
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const {EVENT_NAME,CERTIFY_RESULT,PREPARE_RESULT,PUBLISH_RESULT,CONSUMER_RESULT,GITHUB_STEP_SUMMARY}=process.env;
          const passed=CERTIFY_RESULT==='success' && PREPARE_RESULT==='success' && (EVENT_NAME==='workflow_dispatch' || PUBLISH_RESULT==='success' && CONSUMER_RESULT==='success');
          const report={event:EVENT_NAME,certification:CERTIFY_RESULT,preparation:PREPARE_RESULT,publication:PUBLISH_RESULT,nativeConsumer:CONSUMER_RESULT,status:passed?'PASS':'FAIL',preview:EVENT_NAME==='workflow_dispatch'};
          fs.writeFileSync('release-result.json',JSON.stringify(report,null,2));
          fs.appendFileSync(GITHUB_STEP_SUMMARY,'### npm release evidence\n\n```json\n'+JSON.stringify(report,null,2)+'\n```\nA failed post-publish check leaves the registry version immutable; rerun verification after repair, never substitute bytes.\n');
          process.exitCode=passed?0:1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-release-result
          path: release-result.json
