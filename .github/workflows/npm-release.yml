name: Manually approved npm release preparation
on:
  workflow_dispatch:
    inputs:
      verification_run:
        description: Successful canonical main Native addon acceptance run ID
        required: true
        type: string
      version:
        description: Exact separately owner-approved version in packages/estragon/package.json
        required: true
        type: string
      publish:
        description: Publish only after separate owner authorization and protected npm-release setup
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: github.repository == 'papercraftgames/Estragon' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate approved version and exact full two-engine evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ inputs.verification_run }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node --experimental-strip-types tools/verify-npm-release.ts "$CI_RUN" "$RELEASE_VERSION" "$RUNNER_TEMP/approved-package"
      - uses: actions/upload-artifact@v4
        with:
          name: approved-npm-package
          path: |
            ${{ runner.temp }}/approved-package/*.tgz
            ${{ runner.temp }}/approved-package/release-ready.json
  publish:
    needs: prepare
    if: inputs.publish && vars.NPM_PUBLISH_ENABLED == 'true' && github.repository == 'papercraftgames/Estragon' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.13.0
      - uses: actions/download-artifact@v4
        with:
          name: approved-npm-package
          path: approved-package
      - name: Verify exact already-tested tarball before OIDC publish
        run: node --experimental-strip-types tools/publish-prepared.ts approved-package
