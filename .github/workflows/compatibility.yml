name: C01 native Godot compatibility (two versions total)

on:
  pull_request:
  workflow_dispatch:
    inputs:
      verification_mode:
        description: "Development integrity or strict release authorization (no publishing)"
        type: choice
        options: [development, release]
        default: development

concurrency:
  group: c01-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  oldest-supported:
    runs-on: macos-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Validate TypeScript tooling without starting Godot
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types --test tests/compatibility/*.test.ts
      - name: Download and verify pinned official Godot 4.0.4
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types tools/download-compat-engine.ts
      - name: Collect actual native compiler/runtime evidence
        run: >-
          node --disable-warning=ExperimentalWarning --experimental-strip-types
          tools/check-compatibility.ts
          --engine '4.0.4=${{ env.GODOT_BIN }}'
          --output '${{ runner.temp }}/compatibility'
          --collect-only
      - name: Reject failed required stages without promoting accepted exceptions
        run: >-
          node --disable-warning=ExperimentalWarning --experimental-strip-types
          tools/assert-compatibility.ts
          '${{ runner.temp }}/compatibility/results.json'
      - name: Real editor startup/lifecycle on oldest Godot
        run: >-
          node --disable-warning=ExperimentalWarning --experimental-strip-types
          tools/check-editor-lifecycle.ts
          --engine '4.0.4=${{ env.GODOT_BIN }}'
          --output '${{ runner.temp }}/editor-lifecycle'
      - name: Real unsaved-buffer Play on oldest Godot
        run: >-
          node --disable-warning=ExperimentalWarning --experimental-strip-types
          tools/check-editor-play.ts
          --engine '4.0.4=${{ env.GODOT_BIN }}'
          --output '${{ runner.temp }}/editor-play'
      - name: Fresh distribution, resource pack and native graphics
        run: >-
          node --experimental-strip-types tools/check-distribution.ts
          --engine '4.0.4=${{ env.GODOT_BIN }}'
          --output '${{ runner.temp }}/distribution' --graphics --collect-only
      - name: C01-H development integrity or explicit strict release gate
        run: >-
          node --experimental-strip-types tools/assert-release.ts
          --mode "${{ inputs.verification_mode || 'development' }}"
          '${{ runner.temp }}/compatibility/results.json'
          '${{ runner.temp }}/distribution/results.json'
          '${{ runner.temp }}/editor-lifecycle/results.json'
          '${{ runner.temp }}/editor-play/results.json'
          '${{ runner.temp }}/release-assessment.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-4.0.4-native-evidence
          path: |
            ${{ runner.temp }}/compatibility
            ${{ runner.temp }}/editor-lifecycle
            ${{ runner.temp }}/editor-play
            ${{ runner.temp }}/distribution
            ${{ runner.temp }}/release-assessment.json
          if-no-files-found: warn
